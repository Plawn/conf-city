# Publishes the five images to Docker Hub on a `vX.Y.Z` tag (`just release patch`).
# Repo settings: secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (Read/Write/Delete — the
# description sync needs it), optional variable DOCKERHUB_NAMESPACE (defaults to the user).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

  image:
    needs: [check, version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            script: ""
            title: Conf City — UI
          - name: proxy
            dockerfile: docker/Dockerfile.proxy
            script: ""
            title: Conf City — telemetry proxy
          - name: provider-swarm
            dockerfile: docker/Dockerfile.provider
            script: proxy/providers/docker-swarm.ts
            title: Conf City — Swarm manager provider
          - name: provider-node
            dockerfile: docker/Dockerfile.provider
            script: proxy/providers/docker-node.ts
            title: Conf City — per-node stats agent
          - name: provider-dummy
            dockerfile: docker/Dockerfile.provider
            script: proxy/providers/dummy.ts
            title: Conf City — demo data provider
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.NAMESPACE }}/conf-city-${{ matrix.name }}
          # X.Y.Z, X.Y, and latest only for a release tag (not a pre-release)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.script && format('PROVIDER_SCRIPT={0}', matrix.script) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # Cosmetic: never fail a release that already pushed its images.
      - name: Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.NAMESPACE }}/conf-city-${{ matrix.name }}
          short-description: ${{ matrix.title }}
          readme-filepath: docker/hub/README.md
