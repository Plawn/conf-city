# Every push to main and every PR: the same checks a release runs, plus a build of the
# five images (no push), so a tag only ever lands on a commit that is already green.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  build:
    # A release builds its own images; this only proves they build.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend, dockerfile: docker/Dockerfile.frontend, script: "" }
          - { name: proxy, dockerfile: docker/Dockerfile.proxy, script: "" }
          - { name: provider-swarm, dockerfile: docker/Dockerfile.provider, script: proxy/providers/docker-swarm.ts }
          - { name: provider-node, dockerfile: docker/Dockerfile.provider, script: proxy/providers/docker-node.ts }
          - { name: provider-dummy, dockerfile: docker/Dockerfile.provider, script: proxy/providers/dummy.ts }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.script && format('PROVIDER_SCRIPT={0}', matrix.script) || '' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
