# Swarm provider overlay — real Docker Swarm metrics
#
# provider-swarm (managers) — topology, meta, liveness, logs, resource limits.
# Usage needs one more overlay, pick exactly one:
#   docker-compose.victoria.yml   — read from VictoriaMetrics (Telegraf + node_exporter)
#   docker-compose.node-agent.yml — one agent per node on the Docker socket and procfs
# Usage:
#   Stack:  docker stack deploy -c docker-compose.yml -c docker-compose.swarm.yml \
#                               -c docker-compose.victoria.yml confcity

services:
  provider-swarm:
    image: ${IMAGE_PREFIX:-plawn/conf-city-}provider-swarm:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.provider
      args:
        PROVIDER_SCRIPT: proxy/providers/docker-swarm.ts
    environment:
      PROXY_URL: ws://proxy:4001/ws/provider
      DOCKER_HOST: unix:///var/run/docker.sock
      # Ambient infrastructure: links pointing at these services are not drawn
      # (building kept) — same effect as `confcity.ambient=true` on the service
      # itself, configured here so the target stack needs no restart. Empty by
      # default: shared bridges keep even a well-connected service readable.
      AMBIENT_SERVICES: ${AMBIENT_SERVICES:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        # conf-city infrastructure: not drawn as a building
        - "confcity.hidden=true"
    networks:
      - confcity

networks:
  confcity:
    driver: overlay
    attachable: true
